<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codice Binario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* --- GIORNO: tema di base, stesso sistema del form principale --- */
  :root {
    --paper: #EEF0F3;
    --card: #FFFFFF;
    --ink: #14181F;
    --ink-soft: #5B6472;
    --red: #D6401F;
    --red-dark: #A82F14;
    --line: #D8DCE2;
    --bottone: #14181F;
    --bottone-testo: #EEF0F3;
    --dot: rgba(20,24,31,0.055);
    --stato-errore-testo: #A82F14;
  }

  /* --- NOTTE: segue il telefono di chi guarda, a meno che qui sopra non
     sia stata scelta esplicitamente "Giorno" --- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-tema="giorno"]) {
      --paper: #12151C;
      --card: #1B212B;
      --ink: #F3F0EA;
      --ink-soft: #99A2AC;
      --red: #EC3A3A;
      --red-dark: #C22A2A;
      --line: #2A313C;
      --bottone: #F3F0EA;
      --bottone-testo: #12151C;
      --dot: rgba(243,240,234,0.06);
      --stato-errore-testo: #FF9B9B;
    }
  }

  :root[data-tema="notte"] {
    --paper: #12151C;
    --card: #1B212B;
    --ink: #F3F0EA;
    --ink-soft: #99A2AC;
    --red: #EC3A3A;
    --red-dark: #C22A2A;
    --line: #2A313C;
    --bottone: #F3F0EA;
    --bottone-testo: #12151C;
    --dot: rgba(243,240,234,0.06);
    --stato-errore-testo: #FF9B9B;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    overflow: hidden;
    font-family: 'Space Mono', monospace;
    color: var(--ink);
  }

  #schermo {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  #avvio {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0);
    background-size: 22px 22px;
    text-align: center;
    padding: 32px 24px;
  }

  #avvio.nascosto { display: none; }

  .eyebrow {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--red);
  }

  #avvio .eyebrow {
    font-size: clamp(28px, 10vw, 48px);
    line-height: 1.2;
    letter-spacing: 0.5px;
    text-wrap: balance;
  }

  #avvio-scheda {
    background: var(--card);
    border: 1px dashed var(--line);
    padding: 28px 24px;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  #avvio p {
    max-width: 40ch;
    font-size: 13px;
    line-height: 1.65;
    color: var(--ink-soft);
    margin: 0;
  }

  #bottoneAvvio {
    background: var(--red);
    color: #fff;
    border: none;
    padding: 15px 28px;
    width: 100%;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  #bottoneAvvio:hover { background: var(--red-dark); }

  #errore {
    color: var(--stato-errore-testo);
    font-size: 12px;
    max-width: 40ch;
  }

  #torna-al-form {
    font-size: 11px;
    color: var(--ink-soft);
    text-decoration: none;
    letter-spacing: 0.3px;
    border-bottom: 1px dashed var(--line);
    padding-bottom: 2px;
  }

  #torna-al-form:hover { color: var(--red); border-color: var(--red); }

  #barra-superiore {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: none;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: rgba(32,26,23,0.85);
    backdrop-filter: blur(4px);
    z-index: 10;
  }

  #barra-superiore.visibile { display: flex; }

  #bottoneIndietro {
    background: none;
    border: 1px solid var(--ink-soft);
    color: var(--ink);
    width: 34px;
    height: 34px;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }

  #bottoneIndietro:hover { border-color: var(--red); color: var(--red); }

  #barra-superiore .eyebrow {
    margin: 0;
    font-size: 10px;
  }

  /* --- interruttore chiaro/scuro: stesso stile e comportamento del form --- */
  .interruttore-tema {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 20;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card);
    color: var(--ink);
    border: 1px dashed var(--line);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(32,20,14,0.16);
    transition: border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }

  .interruttore-tema:hover {
    border-color: var(--red);
    color: var(--red);
    transform: translateY(-1px);
  }

  .interruttore-tema svg { display: block; }
  .interruttore-tema svg[hidden] { display: none; }
  .interruttore-tema[hidden] { display: none; }
</style>
</head>
<body>
  <button class="interruttore-tema" id="interruttoreTema" aria-label="Cambia tema chiaro/scuro">
    <svg class="icona-sole" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="icona-luna" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <canvas id="schermo"></canvas>

  <div id="avvio">
    <div class="eyebrow">IL MONDO A ROTOLI</div>
    <div id="avvio-scheda">
      <p>Mettiti davanti allo schermo: la telecamera ti trasforma in codice, un carattere alla volta. I numeri che vedrai sono i bit veri dei messaggi scritti da chi è passato di qui prima di te.</p>
      <button id="bottoneAvvio">Attiva la telecamera</button>
      <div id="errore"></div>
    </div>
    <a id="torna-al-form" href="./index.html">← torna al form</a>
  </div>

  <div id="barra-superiore">
    <button id="bottoneIndietro" aria-label="Torna indietro">←</button>
    <div class="eyebrow">IL MONDO A ROTOLI</div>
  </div>

  <video id="video" autoplay playsinline muted style="display:none;"></video>

  <script>
    // --- interruttore chiaro/scuro (stessa logica del form: di default segue
    // il telefono, la scelta esplicita viene ricordata) ---
    const CHIAVE_TEMA = 'mondo_a_rotoli_tema';
    const interruttoreTema = document.getElementById('interruttoreTema');
    const iconaSole = interruttoreTema.querySelector('.icona-sole');
    const iconaLuna = interruttoreTema.querySelector('.icona-luna');

    function temaEffettivo() {
      const esplicito = document.documentElement.dataset.tema;
      if (esplicito === 'giorno' || esplicito === 'notte') return esplicito;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'notte' : 'giorno';
    }

    function aggiornaIconaTema() {
      const attuale = temaEffettivo();
      iconaSole.hidden = attuale !== 'giorno';
      iconaLuna.hidden = attuale !== 'notte';
    }

    try {
      const salvato = localStorage.getItem(CHIAVE_TEMA);
      if (salvato === 'giorno' || salvato === 'notte') {
        document.documentElement.dataset.tema = salvato;
      }
    } catch (errore) {}

    aggiornaIconaTema();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aggiornaIconaTema);

    interruttoreTema.addEventListener('click', () => {
      const nuovo = temaEffettivo() === 'notte' ? 'giorno' : 'notte';
      document.documentElement.dataset.tema = nuovo;
      try { localStorage.setItem(CHIAVE_TEMA, nuovo); } catch (errore) {}
      aggiornaIconaTema();
    });

    const COLONNE = 70;
    const SOGLIA_LUMINOSITA = 130;
    const COLORE_CHIARO_SFONDO = '#FFFFFF';
    const COLORE_CHIARO_SEGNO = '#C81E1E';
    const COLORE_SCURO_SFONDO = '#C81E1E';
    const COLORE_SCURO_SEGNO = '#FFFFFF';

    // Le cifre mostrate in ogni cella non sono generate a caso: sono i bit
    // veri dei messaggi scritti dalle persone sul form. La luminosità della
    // webcam decide solo il colore della cella (per mostrare la sagoma), il
    // CARATTERE mostrato scorre dal flusso di bit reale.
    const API_URL = './api';
    const INTERVALLO_AGGIORNAMENTO_MESSAGGI = 5000;
    const BIT_DI_ESEMPIO = // usato solo finché non arriva il primo messaggio vero
      Array.from(new TextEncoder().encode('il mondo a rotoli'))
        .map(b => b.toString(2).padStart(8, '0')).join('');

    let flussoBit = BIT_DI_ESEMPIO;
    // Ogni cella legge una posizione FISSA nel flusso (in base alla sua riga
    // e colonna): così il carattere che mostra resta stabile da un frame
    // all'altro, invece di cambiare 60 volte al secondo. Lo scorrimento
    // "lento" arriva da questo scarto globale, aggiornato poche volte al
    // secondo, non a ogni frame.
    let scartoGlobale = 0;
    setInterval(() => { scartoGlobale++; }, 200);

    function testoInBit(testo) {
      return Array.from(new TextEncoder().encode(testo))
        .map(b => b.toString(2).padStart(8, '0')).join('');
    }

    async function aggiornaFlussoMessaggi() {
      try {
        const risposta = await fetch(`${API_URL}/history.php?limit=30&offset=0`);
        if (!risposta.ok) return;
        const dati = await risposta.json();
        const messaggi = dati.messaggi || [];
        if (messaggi.length > 0) {
          flussoBit = messaggi.map(m => testoInBit(m.text)).join('00000000');
        }
      } catch (errore) {
        // Se l'hosting non risponde (es. durante lo sviluppo in locale),
        // restiamo sul flusso di esempio: la sagoma resta comunque visibile.
      }
    }

    aggiornaFlussoMessaggi();
    setInterval(aggiornaFlussoMessaggi, INTERVALLO_AGGIORNAMENTO_MESSAGGI);

    function cifraPerCella(indiceCella) {
      return flussoBit[(indiceCella + scartoGlobale) % flussoBit.length];
    }

    const video = document.getElementById('video');
    const schermo = document.getElementById('schermo');
    const ctx = schermo.getContext('2d');
    const avvio = document.getElementById('avvio');
    const bottoneAvvio = document.getElementById('bottoneAvvio');
    const erroreBox = document.getElementById('errore');

    const campionatore = document.createElement('canvas');
    const ctxCampionatore = campionatore.getContext('2d', { willReadFrequently: true });

    const barraSuperiore = document.getElementById('barra-superiore');
    const bottoneIndietro = document.getElementById('bottoneIndietro');
    let telecameraAttiva = false;

    function ridimensiona() {
      schermo.width = window.innerWidth;
      schermo.height = window.innerHeight;
    }
    window.addEventListener('resize', ridimensiona);
    ridimensiona();

    async function avviaTelecamera() {
      erroreBox.textContent = '';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        avvio.classList.add('nascosto');
        barraSuperiore.classList.add('visibile');
        interruttoreTema.hidden = true;
        telecameraAttiva = true;
        requestAnimationFrame(disegnaFrame);
      } catch (errore) {
        erroreBox.textContent = 'Non riesco ad accedere alla telecamera: ' + errore.message;
      }
    }

    function tornaIndietro() {
      telecameraAttiva = false;
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(traccia => traccia.stop());
        video.srcObject = null;
      }
      barraSuperiore.classList.remove('visibile');
      avvio.classList.remove('nascosto');
      interruttoreTema.hidden = false;
      ctx.clearRect(0, 0, schermo.width, schermo.height);
    }

    bottoneAvvio.addEventListener('click', avviaTelecamera);
    bottoneIndietro.addEventListener('click', tornaIndietro);

    function disegnaFrame() {
      if (!telecameraAttiva) return;

      if (video.readyState >= 2 && video.videoWidth > 0) {
        const rapporto = video.videoHeight / video.videoWidth;
        const righe = Math.round(COLONNE * rapporto * 0.55); // 0.55: le celle sono più alte che larghe

        campionatore.width = COLONNE;
        campionatore.height = righe;

        // Specchiato orizzontalmente, come guardarsi allo specchio.
        ctxCampionatore.save();
        ctxCampionatore.translate(COLONNE, 0);
        ctxCampionatore.scale(-1, 1);
        ctxCampionatore.drawImage(video, 0, 0, COLONNE, righe);
        ctxCampionatore.restore();

        const dati = ctxCampionatore.getImageData(0, 0, COLONNE, righe).data;

        const cellaLarghezza = schermo.width / COLONNE;
        const cellaAltezza = schermo.height / righe;
        const dimensioneFont = Math.min(cellaLarghezza, cellaAltezza) * 1.05;

        ctx.font = `bold ${dimensioneFont}px 'Space Mono', monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (let riga = 0; riga < righe; riga++) {
          for (let colonna = 0; colonna < COLONNE; colonna++) {
            const indice = (riga * COLONNE + colonna) * 4;
            const luminosita = (dati[indice] + dati[indice + 1] + dati[indice + 2]) / 3;
            const chiaro = luminosita > SOGLIA_LUMINOSITA;

            const x = colonna * cellaLarghezza;
            const y = riga * cellaAltezza;

            ctx.fillStyle = chiaro ? COLORE_CHIARO_SFONDO : COLORE_SCURO_SFONDO;
            ctx.fillRect(x, y, cellaLarghezza + 1, cellaAltezza + 1);

            ctx.fillStyle = chiaro ? COLORE_CHIARO_SEGNO : COLORE_SCURO_SEGNO;
            const indiceCella = riga * COLONNE + colonna;
            ctx.fillText(cifraPerCella(indiceCella), x + cellaLarghezza / 2, y + cellaAltezza / 2 + 1);
          }
        }
      }

      requestAnimationFrame(disegnaFrame);
    }
  </script>
</body>
</html>
